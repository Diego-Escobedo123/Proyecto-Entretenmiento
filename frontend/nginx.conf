# nginx para el build de Vite (ver Dockerfile).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Archivos con hash en el nombre (assets/index-abc123.js): cambian de nombre
  # en cada build, así que el navegador los puede guardar para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El router usa history mode (/profile, /lists/:id...): cualquier ruta que
  # no sea un archivo devuelve index.html y Vue Router resuelve la pantalla.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html sin caché, para que cada deploy se vea al recargar.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
