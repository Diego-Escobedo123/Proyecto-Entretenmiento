# CI: lint + build de backend y frontend en cada push y en cada PR.
# Para que bloquee el merge, marcar los jobs "Backend" y "Frontend" como
# required en Settings → Branches (protección de dev y main).
name: CI

on:
  push:
  pull_request:
    branches: [dev, main]

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # El typecheck necesita los tipos del cliente de Prisma.
      - run: bunx prisma generate
      - run: bun run lint
      - run: bun run typecheck

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # vue-tsc necesita Node real (ver frontend/Dockerfile).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
